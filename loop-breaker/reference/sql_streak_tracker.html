<div id="app"></div>
<style>
  #app {
    font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    background: #0d1117;
    color: #c9d1d9;
    padding: 32px 24px;
    border-radius: 12px;
    max-width: 720px;
    margin: 0 auto;
  }
  .title-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
  .title { font-size: 18px; font-weight: 700; color: #58e6c4; letter-spacing: 0.3px; }
  .subtitle { font-size: 12px; color: #6e7681; }
  .stats-row { display: flex; gap: 20px; margin: 20px 0 24px 0; flex-wrap: wrap; }
  .stat { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 12px 16px; min-width: 110px; }
  .stat-num { font-size: 22px; font-weight: 700; color: #58e6c4; }
  .stat-label { font-size: 11px; color: #6e7681; margin-top: 2px; }

  .grid-wrap { overflow-x: auto; padding-bottom: 4px; }
  .months-row { display: flex; margin-left: 34px; margin-bottom: 4px; font-size: 10px; color: #6e7681; }
  .month-cell { width: 33px; }
  .body-row { display: flex; }
  .day-labels { display: flex; flex-direction: column; gap: 3px; margin-right: 6px; font-size: 9px; color: #6e7681; }
  .day-labels div { height: 30px; line-height: 30px; }
  .grid { display: flex; gap: 3px; }
  .week-col { display: flex; flex-direction: column; gap: 3px; }
  .cell {
    width: 30px; height: 30px; border-radius: 4px; background: #161b22; border: 1px solid #21262d;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #6e7681; font-family: inherit; cursor: pointer;
  }
  .cell.hidden { visibility: hidden; cursor: default; }
  .cell.l1 { background: #0d3b34; border-color: #0d3b34; color: #9fe8d8; }
  .cell.l2 { background: #1a8a72; border-color: #1a8a72; color: #eafffa; font-weight: 700; }
  .cell.l3 { background: #58e6c4; border-color: #58e6c4; color: #0d1117; font-weight: 700; }
  .cell.today { box-shadow: 0 0 0 2px #f0883e; }
  .cell.selected { box-shadow: 0 0 0 2px #ffffff; }
  .legend { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 10px; color: #6e7681; }
  .legend .cell { width: 14px; height: 14px; cursor: default; }

  .divider { border-top: 1px solid #21262d; margin: 28px 0 20px 0; }

  .picker-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .picker-row label { font-size: 12px; color: #6e7681; }
  input[type="date"] {
    background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px;
    padding: 6px 10px; font-family: inherit; font-size: 13px;
  }
  .day-count-badge {
    font-size: 11px; padding: 3px 10px; border-radius: 10px; background: #161b22; border: 1px solid #30363d; color: #6e7681;
  }
  .picker-note { font-size: 11px; color: #6e7681; margin-bottom: 16px; }

  .roadmap-list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .roadmap-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    background: #161b22; border: 1px solid #21262d; border-radius: 6px; font-size: 12.5px;
  }
  .roadmap-item.checked { border-color: #1a8a72; }
  .roadmap-item input { margin-top: 2px; accent-color: #58e6c4; cursor: pointer; }
  .roadmap-item .txt { line-height: 1.4; flex: 1; }
  .roadmap-item.checked .txt { color: #9fe8d8; }
  .roadmap-item .done-date { font-size: 10px; color: #6e7681; white-space: nowrap; }
  .loading { color: #6e7681; font-size: 13px; }
</style>

<script>
const TOPICS = [
  "Query Execution Order (FROM→WHERE→GROUP BY→HAVING→SELECT→ORDER BY→LIMIT)",
  "CREATE TABLE + Constraints + ALTER TABLE + ENUM",
  "SELECT / WHERE / Basic Operators",
  "LIKE Operator (wildcards % and _)",
  "ORDER BY / LIMIT / DISTINCT",
  "GROUP BY / HAVING / Aggregate Functions",
  "CASE WHEN",
  "NULL Handling — IS NULL, COALESCE/IFNULL",
  "JOINs — Inner, Left, Right, Full, Cross, Self Join",
  "Subqueries — Nested, Correlated, WHERE/SELECT/FROM",
  "EXISTS / NOT EXISTS",
  "Set Operations — UNION / INTERSECT / EXCEPT / UNION ALL",
  "String & Date Functions",
  "Window Functions (ROW_NUMBER, RANK, LAG, LEAD, etc.)",
  "CTEs (WITH clause)",
  "Recursive CTEs",
  "Views / Index / Stored Procedures",
  "Transactions & ACID",
  "Mixed Revision + Timed Practice Sets"
];

function pad(n) { return n < 10 ? '0' + n : '' + n; }
// Always use LOCAL date components (never toISOString) to avoid
// UTC/timezone shifting the stored date by a day for non-UTC timezones.
function fmtDate(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

const todayStr = () => fmtDate(new Date());
let selectedDate = todayStr();

// completed[topicIndex] = "YYYY-MM-DD" the date it was marked done.
// This is the ONLY source of truth for whether a topic is checked —
// checked state is global and identical no matter which date you're viewing.
// The heatmap intensity for a given day is just "how many topics have
// that day as their completion date."
let cached = null; // { completed: {...} }

async function loadData() {
  try {
    const result = await window.storage.get('sql-checkins-v3', false);
    return result ? JSON.parse(result.value) : { completed: {} };
  } catch (e) {
    return { completed: {} };
  }
}

async function saveData(data) {
  try {
    await window.storage.set('sql-checkins-v3', JSON.stringify(data), false);
  } catch (e) {
    console.error('storage error', e);
  }
}

function buildWeeks() {
  const days = [];
  const today = new Date();
  const totalDays = 8 * 7;
  for (let i = totalDays - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const firstDay = days[0].getDay();
  const padded = [];
  for (let i = 0; i < firstDay; i++) padded.push(null);
  padded.push(...days);
  const weeks = [];
  for (let i = 0; i < padded.length; i += 7) weeks.push(padded.slice(i, i + 7));
  return weeks;
}

function countsByDate(completed) {
  const counts = {};
  Object.values(completed).forEach(dateStr => {
    counts[dateStr] = (counts[dateStr] || 0) + 1;
  });
  return counts;
}

function computeStreak(counts) {
  let streak = 0;
  let cursor = new Date();
  while (true) {
    const key = fmtDate(cursor);
    if (counts[key] > 0) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else break;
  }
  return streak;
}

function intensityClass(count) {
  if (count >= 3) return 'l3';
  if (count === 2) return 'l2';
  if (count === 1) return 'l1';
  return '';
}

async function render(skipLoad) {
  const app = document.getElementById('app');
  if (!skipLoad) {
    if (cached === null) app.innerHTML = '<div class="loading">Loading tracker...</div>';
    cached = await loadData();
  }
  const completed = cached.completed;
  const counts = countsByDate(completed);

  const weeks = buildWeeks();
  const isToday = todayStr();
  const streak = computeStreak(counts);
  const totalActiveDays = Object.values(counts).filter(c => c > 0).length;
  const totalTopicsDone = Object.keys(completed).length;

  let lastMonth = -1;
  const monthLabels = weeks.map(week => {
    const firstReal = week.find(d => d);
    if (firstReal && firstReal.getMonth() !== lastMonth) {
      lastMonth = firstReal.getMonth();
      return firstReal.toLocaleString('default', { month: 'short' });
    }
    return '';
  });
  const monthsHtml = monthLabels.map(m => `<div class="month-cell">${m}</div>`).join('');

  const gridHtml = weeks.map(week => {
    const cellsHtml = week.map(d => {
      if (!d) return `<div class="cell hidden"></div>`;
      const key = fmtDate(d);
      const count = counts[key] || 0;
      const cls = `cell ${intensityClass(count)}${key === isToday ? ' today' : ''}${key === selectedDate ? ' selected' : ''}`;
      return `<div class="${cls}" data-date="${key}" title="${key}${count ? ' — ' + count + ' topic(s) completed' : ''}">${d.getDate()}</div>`;
    }).join('');
    return `<div class="week-col">${cellsHtml}</div>`;
  }).join('');

  const doneOnSelected = Object.keys(completed).filter(idx => completed[idx] === selectedDate).length;

  const roadmapHtml = TOPICS.map((t, i) => {
    const doneDate = completed[i];
    const checked = !!doneDate;
    return `
      <label class="roadmap-item${checked ? ' checked' : ''}">
        <input type="checkbox" data-idx="${i}" ${checked ? 'checked' : ''} />
        <span class="txt">${i + 1}. ${t}</span>
        ${checked ? `<span class="done-date">done ${doneDate}</span>` : ''}
      </label>`;
  }).join('');

  app.innerHTML = `
    <div class="title-row">
      <div class="title">SELECT * FROM consistency;</div>
      <div class="subtitle">SQL prep check-in log</div>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="stat-num">${streak}</div><div class="stat-label">current streak (days)</div></div>
      <div class="stat"><div class="stat-num">${totalActiveDays}</div><div class="stat-label">active days total</div></div>
      <div class="stat"><div class="stat-num">${totalTopicsDone} / ${TOPICS.length}</div><div class="stat-label">topics completed overall</div></div>
    </div>
    <div class="grid-wrap">
      <div class="months-row">${monthsHtml}</div>
      <div class="body-row">
        <div class="day-labels"><div>Sun</div><div></div><div>Tue</div><div></div><div>Thu</div><div></div><div>Sat</div></div>
        <div class="grid">${gridHtml}</div>
      </div>
      <div class="legend">
        <span>Less</span>
        <div class="cell"></div>
        <div class="cell l1"></div>
        <div class="cell l2"></div>
        <div class="cell l3"></div>
        <span>More (1 / 2 / 3+ topics completed that day)</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="picker-row">
      <label>Log new completions under date:</label>
      <input type="date" id="datePicker" value="${selectedDate}" max="${todayStr()}" />
      <span class="day-count-badge">${doneOnSelected} topic${doneOnSelected === 1 ? '' : 's'} completed on this date</span>
    </div>
    <div class="picker-note">This checklist is your overall progress — once a topic is checked, it stays checked on every date. The date above only controls which day gets credit in the heatmap when you check something new.</div>

    <div class="roadmap-list">${roadmapHtml}</div>
  `;

  document.querySelectorAll('.cell[data-date]').forEach(cell => {
    cell.onclick = () => {
      selectedDate = cell.getAttribute('data-date');
      render(true);
    };
  });

  document.getElementById('datePicker').onchange = (e) => {
    selectedDate = e.target.value;
    render(true);
  };

  document.querySelectorAll('.roadmap-item input').forEach(box => {
    box.onchange = (e) => {
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      const nextCompleted = { ...cached.completed };
      if (e.target.checked) {
        nextCompleted[idx] = selectedDate; // credit whichever date is selected
      } else {
        delete nextCompleted[idx]; // unchecking clears it everywhere, permanently
      }
      cached = { ...cached, completed: nextCompleted };
      render(true);         // instant UI update, no loading flash
      saveData(cached);     // persist in the background
    };
  });
}

render();
</script>
