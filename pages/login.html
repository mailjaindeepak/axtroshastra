<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Axtroshastra</title>
<meta name="description" content="Log in to Axtroshastra to view your saved kundli reports.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%23151C39%27/%3E%3Cpath d=%27M12 3 L14.2 9.8 L21 12 L14.2 14.2 L12 21 L9.8 14.2 L3 12 L9.8 9.8 Z%27 fill=%27%23E4B04A%27/%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://axtroshastra.com/login">
<style>
:root{--ink:#23253B;--midnight:#151C39;--paper:#FAF6ED;--sindoor:#C93B2E;
--sindoor-dark:#A82F24;--haldi:#E4B04A;--muted:#6B6D82;--line:#E7E0D2;
--body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;
min-height:100vh;display:flex;flex-direction:column}
.hero{background:radial-gradient(900px 460px at 50% -10%,#1D2547,var(--midnight) 60%);
color:#F3EFE4;padding:44px 20px 34px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:22px}
.brand svg{width:26px;height:26px}
.brand span{font-weight:800;font-size:17px;color:#F3EFE4}
.hero h1{font-size:26px;color:#fff}
.hero p{color:#B9BBD0;margin-top:6px;font-size:14.5px}
.wrap{max-width:400px;margin:0 auto;padding:0 20px;width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 22px;
margin-top:-22px;box-shadow:0 6px 24px rgba(70,50,30,.08)}
label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:7px}
input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;
font-size:16px;font-family:inherit;background:#fff;color:var(--ink);letter-spacing:.02em}
input:focus{outline:0;border-color:var(--haldi)}
.otp{letter-spacing:.4em;text-align:center;font-size:20px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--sindoor);color:#fff;
font-weight:800;font-size:16px;padding:14px;margin-top:16px;cursor:pointer;font-family:inherit;
box-shadow:0 5px 0 var(--sindoor-dark)}
.btn:disabled{opacity:.55;box-shadow:none;cursor:default}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;text-align:center}
.msg{font-size:13.5px;margin-top:12px;text-align:center;min-height:18px}
.msg.err{color:var(--sindoor)}
.msg.ok{color:#157a52}
.link{background:none;border:0;color:var(--sindoor);font-weight:700;font-size:13.5px;
cursor:pointer;font-family:inherit;text-decoration:underline}
.hidden{display:none}
.legal{font-size:11.5px;color:var(--muted);text-align:center;margin:22px auto 30px;max-width:340px}
.legal a{color:var(--muted)}
</style>
</head>
<body>
<div class="hero">
  <div class="brand">
    <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#151C39"/><path d="M12 3 L14.2 9.8 L21 12 L14.2 14.2 L12 21 L9.8 14.2 L3 12 L9.8 9.8 Z" fill="#E4B04A"/></svg>
    <span>Axtroshastra</span>
  </div>
  <h1>Log in</h1>
  <p>See your reports and account details</p>
</div>

<div class="wrap">
  <div class="card">
    <!-- Step 1: mobile -->
    <form id="step-mobile" onsubmit="return sendOtp(event)">
      <label for="mobile">Mobile number</label>
      <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel"
             placeholder="+91 98XXX XXXXX" required>
      <button class="btn" id="send-btn" type="submit">Send OTP</button>
      <div class="hint">We'll send a one-time code to this number.</div>
    </form>

    <!-- Step 2: OTP -->
    <form id="step-otp" class="hidden" onsubmit="return verifyOtp(event)">
      <label for="code">Enter the 6-digit code</label>
      <input id="code" name="code" class="otp" type="text" inputmode="numeric"
             autocomplete="one-time-code" maxlength="6" pattern="[0-9]*"
             placeholder="––––––" required>
      <button class="btn" id="verify-btn" type="submit">Verify &amp; log in</button>
      <div class="hint">
        Sent to <span id="to-mobile"></span> ·
        <button type="button" class="link" onclick="backToMobile()">Change</button> ·
        <button type="button" class="link" id="resend" onclick="sendOtp(event, true)">Resend</button>
      </div>
    </form>

    <div class="msg" id="msg"></div>
  </div>

  <div class="legal">
    By continuing you agree to our
    <a href="/terms">Terms of Use</a> and <a href="/privacy">Privacy Policy</a>.
  </div>
</div>

<script>
var currentMobile = "";

function setMsg(text, kind){
  var m = document.getElementById('msg');
  m.textContent = text || "";
  m.className = "msg" + (kind ? " " + kind : "");
}

async function sendOtp(e, isResend){
  if (e && e.preventDefault) e.preventDefault();
  var mobile = document.getElementById('mobile').value.trim();
  if (!mobile){ setMsg("Please enter your mobile number.", "err"); return false; }
  currentMobile = mobile;
  var btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = "Sending…";
  setMsg("");
  try {
    var r = await fetch('/api/auth/request-otp', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mobile: mobile})
    });
    var data = await r.json().catch(function(){ return {}; });
    if (!r.ok){
      setMsg(data.detail || "Could not send code. Please try again.", "err");
    } else {
      document.getElementById('step-mobile').classList.add('hidden');
      document.getElementById('step-otp').classList.remove('hidden');
      document.getElementById('to-mobile').textContent = mobile;
      document.getElementById('code').focus();
      var via = data.channel === 'sms' ? 'SMS' : (data.channel === 'dev' ? 'the server log' : 'WhatsApp');
      setMsg(isResend ? "New code sent via " + via + "." : "Code sent via " + via + ".", "ok");
      if (data.dev_code){ document.getElementById('code').value = data.dev_code; }
    }
  } catch(err){
    setMsg("Network error. Please try again.", "err");
  }
  btn.disabled = false; btn.textContent = "Send OTP";
  return false;
}

async function verifyOtp(e){
  if (e && e.preventDefault) e.preventDefault();
  var code = document.getElementById('code').value.trim();
  var btn = document.getElementById('verify-btn');
  btn.disabled = true; btn.textContent = "Verifying…";
  setMsg("");
  try {
    var r = await fetch('/api/auth/verify-otp', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mobile: currentMobile, code: code})
    });
    var data = await r.json().catch(function(){ return {}; });
    if (!r.ok){
      setMsg(data.detail || "Invalid or expired code.", "err");
      btn.disabled = false; btn.textContent = "Verify & log in";
    } else {
      setMsg("Logged in! Redirecting…", "ok");
      // honor ?next= (same-origin path only) so login bounces back to where
      // the user was headed — e.g. /account from a report's back button
      var nx = new URLSearchParams(location.search).get('next') || '/account';
      if (!/^\/[^\/\\]/.test(nx)) nx = '/account';
      location.href = nx;
    }
  } catch(err){
    setMsg("Network error. Please try again.", "err");
    btn.disabled = false; btn.textContent = "Verify & log in";
  }
  return false;
}

function backToMobile(){
  document.getElementById('step-otp').classList.add('hidden');
  document.getElementById('step-mobile').classList.remove('hidden');
  setMsg("");
}
</script>
</body>
</html>
