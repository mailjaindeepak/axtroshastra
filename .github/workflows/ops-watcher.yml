# T6 — Watcher bot. The lightweight heartbeat: hourly health checks on the live
# site. (The 5-minute uptime ping is a FREE external monitor — UptimeRobot — not
# this, to stay inside GitHub's free minutes.) The watcher alerts by itself on a
# red result (see ops/watcher.py).
name: ops-watcher

on:
  schedule:
    - cron: "17 * * * *"        # hourly, offset 17 min to avoid the top-of-hour rush
  workflow_dispatch:             # allow manual "check now"

# Don't pile up runs if one is slow.
concurrency:
  group: ops-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet twilio        # WhatsApp alerts; email uses stdlib
      - name: Run the watcher (alerts itself if red)
        env:
          OPS_TARGET_URL:        ${{ secrets.OPS_TARGET_URL }}
          STATS_KEY:             ${{ secrets.STATS_KEY }}
          OPS_ALERT_EMAILS:      ${{ secrets.OPS_ALERT_EMAILS }}
          OPS_ALERT_WHATSAPP:    ${{ secrets.OPS_ALERT_WHATSAPP }}
          SMTP_HOST:             ${{ secrets.SMTP_HOST }}
          SMTP_PORT:             ${{ secrets.SMTP_PORT }}
          SMTP_USER:             ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:         ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:             ${{ secrets.SMTP_FROM }}
          TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM:  ${{ secrets.TWILIO_WHATSAPP_FROM }}
        run: python -m ops.watcher
