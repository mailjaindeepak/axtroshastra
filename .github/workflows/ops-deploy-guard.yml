# SUPERSEDED — the CI workflow (ci.yml) now includes the deploy guard steps
# inside its deploy job (pytest → E2E → deploy → wait Green → smoke test →
# auto-rollback). Use the CI "Run workflow" button for normal deploys.
#
# This standalone file is kept as an EMERGENCY "deploy-only" option: it skips
# re-running pytest/E2E and just deploys + verifies + rolls back. Use it when
# tests already passed in a prior CI run and you need to redeploy quickly.
#
# Original description:
# Guarded deploy with AUTOMATIC ROLLBACK (Method B: redeploy last-good).
#   1. Record the CURRENT live version -> rollback target.
#   2. Deploy the new version.
#   3. Wait for Green.
#   4. Run smoke test.
#   5. If not Green or smoke fails -> roll back and alert.
name: ops-deploy-guard

on:
  workflow_dispatch:
  # push:
  #   branches: [ aws-mysql ]

concurrency:
  group: eb-deploy             # never allow two deploys/rollbacks at once
  cancel-in-progress: false

jobs:
  guarded-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            ${{ secrets.AWS_REGION }}
      OPS_EB_ENV:            ${{ secrets.OPS_EB_ENV }}
      # alerting + smoke test
      OPS_TARGET_URL:        ${{ secrets.OPS_TARGET_URL }}
      STATS_KEY:             ${{ secrets.STATS_KEY }}
      OPS_ALERT_EMAILS:      ${{ secrets.OPS_ALERT_EMAILS }}
      OPS_ALERT_WHATSAPP:    ${{ secrets.OPS_ALERT_WHATSAPP }}
      SMTP_HOST:             ${{ secrets.SMTP_HOST }}
      SMTP_PORT:             ${{ secrets.SMTP_PORT }}
      SMTP_USER:             ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD:         ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM:             ${{ secrets.SMTP_FROM }}
      TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_FROM:  ${{ secrets.TWILIO_WHATSAPP_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install --quiet awsebcli awscli twilio

      # 1) The version that is live RIGHT NOW is our PRE-DEPLOY rollback target.
      #    Captured BEFORE we deploy so that, if the new version turns out bad,
      #    we can redeploy exactly what was known-good moments ago.
      - name: Record last-good (pre-deploy) version
        id: lastgood
        run: |
          LG=$(python -c "from ops import mechanic; print(mechanic.current_version() or '')")
          echo "Current live (pre-deploy, last-good) version: $LG"
          echo "label=$LG" >> "$GITHUB_OUTPUT"

      # 2) Deploy the new version.
      #    Same fallback defaults as ci.yml — the OPS_EB_ENV / AWS_REGION
      #    secrets are optional.
      - name: Deploy
        run: eb deploy "${OPS_EB_ENV:-AxtroShastraProd}"

      # 3) Wait for the environment to go Green (up to ~10 min).
      - name: Wait for Green
        id: green
        continue-on-error: true
        run: |
          for i in $(seq 1 40); do
            H=$(aws elasticbeanstalk describe-environments \
                  --environment-names "${OPS_EB_ENV:-AxtroShastraProd}" \
                  --region "${AWS_REGION:-ap-south-1}" \
                  --query 'Environments[0].Health' --output text)
            echo "attempt $i: health=$H"
            [ "$H" = "Green" ] && exit 0
            sleep 15
          done
          echo "environment did not reach Green"; exit 1

      # 4) Smoke test the live site like a real customer.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ops/robot_customer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # No --with-deps: apt-get stalls on unreachable Ubuntu mirrors and wedges
      # the job. ubuntu-latest already ships Chromium's system libraries.
      - name: Smoke test (robot customer)
        id: smoke
        continue-on-error: true
        timeout-minutes: 25
        working-directory: ops/robot_customer
        run: |
          npm install
          npx playwright install chromium
          npx playwright test

      # 5a) SUCCESS path -> record the passing run + alert + dashboard.
      - name: Report success
        if: steps.green.outcome == 'success' && steps.smoke.outcome == 'success'
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -m ops.history record-run \
            --status pass \
            --detail "Guarded deploy: new version went Green and passed the smoke test." \
            --run-url "$RUN_URL"
          curl -sf -X POST \
            "${OPS_TARGET_URL}/api/admin/ops_event?key=${STATS_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"deploy\",\"status\":\"pass\",\"detail\":\"Guarded deploy succeeded — Green + smoke test passed.\",\"run_url\":\"${RUN_URL}\",\"severity\":\"info\"}" \
            || echo "dashboard record failed (non-fatal)"
          python -c "from ops import alerts; import os; alerts.send_alert('Deploy OK', 'New version deployed and smoke test passed on the live site.', 'info')"

      # 5b) FAILURE path -> automatic rollback to the PRE-DEPLOY last-good + alert + dashboard.
      #     This rollback is SAFE (a known-good label captured moments ago), so it
      #     proceeds regardless of OPS_ROLLBACK_ARMED — but it still records the
      #     failing run + the rollback in history and alerts.
      - name: Roll back on failure
        if: always() && steps.lastgood.outcome == 'success' && (steps.green.outcome != 'success' || steps.smoke.outcome != 'success')
        run: |
          LG="${{ steps.lastgood.outputs.label }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Deploy unhealthy — rolling back to pre-deploy version: $LG"
          # Record the failing guarded-deploy run either way.
          python -m ops.history record-run \
            --status fail \
            --detail "Guarded deploy: env never went Green or smoke test failed; rolling back." \
            --run-url "$RUN_URL"
          curl -sf -X POST \
            "${OPS_TARGET_URL}/api/admin/ops_event?key=${STATS_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"deploy\",\"status\":\"fail\",\"detail\":\"Guarded deploy FAILED — env not Green or smoke test failed.\",\"run_url\":\"${RUN_URL}\",\"severity\":\"critical\"}" \
            || echo "dashboard record failed (non-fatal)"
          if [ -z "$LG" ] || [ "$LG" = "None" ]; then
            python -c "from ops import alerts; alerts.send_alert('Deploy FAILED — manual rollback needed', 'Smoke/health failed but no last-good version label was captured. Roll back manually in the EB console.', 'critical')"
            exit 1
          fi
          # Capture the (bad) version we are rolling back FROM, for the history record.
          BAD=$(python -c "from ops import mechanic; print(mechanic.current_version() or '')")
          if [ "$BAD" = "$LG" ]; then
            echo "Deploy command failed before changing the version — live site unchanged."
            python -c "from ops import alerts; alerts.send_alert('Deploy command FAILED', 'The eb deploy command itself failed. No new version was deployed — live site is unchanged. Check the Actions log: ${RUN_URL}', 'critical')"
            exit 1
          fi
          python -m ops.mechanic rollback --last-good "$LG"
          # mechanic.rollback already alerts; also record the rollback in history.
          python -m ops.history record-rollback \
            --from "$BAD" \
            --to "$LG" \
            --reason "Post-deploy guard: new version failed health/smoke — reverted to pre-deploy version."
          curl -sf -X POST \
            "${OPS_TARGET_URL}/api/admin/ops_event?key=${STATS_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"rollback\",\"status\":\"triggered\",\"detail\":\"Post-deploy guard rollback: ${BAD} -> ${LG}\",\"run_url\":\"${RUN_URL}\",\"from_ver\":\"${BAD}\",\"to_ver\":\"${LG}\",\"severity\":\"critical\"}" \
            || echo "dashboard record failed (non-fatal)"
          # Fail the job so it shows red.
          exit 1
