# T6 — Guarded deploy with AUTOMATIC ROLLBACK (Method B: redeploy last-good).
#
# Use this INSTEAD of a manual `eb deploy` when you want a bad deploy to revert
# itself. The exact steps:
#   1. Record the CURRENT live version  -> this is the rollback target ("last good").
#   2. Deploy the new version.
#   3. Wait for the environment to report Green (Enhanced health).
#   4. Run the robot-customer smoke test against the live site.
#   5. If the env never goes Green OR the smoke test fails -> roll back to the
#      last-good version and alert. Otherwise: success (the new version stays).
#
# Opt-in: it's manual (workflow_dispatch) until Deepak sets the AWS secrets and is
# happy to let CI deploy. To auto-run on merges, uncomment the `push:` trigger.
name: ops-deploy-guard

on:
  workflow_dispatch:
  # push:
  #   branches: [ aws-mysql ]

concurrency:
  group: ops-deploy            # never allow two deploys/rollbacks at once
  cancel-in-progress: false

jobs:
  guarded-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:            ${{ secrets.AWS_REGION }}
      OPS_EB_ENV:            ${{ secrets.OPS_EB_ENV }}
      # alerting + smoke test
      OPS_TARGET_URL:        ${{ secrets.OPS_TARGET_URL }}
      STATS_KEY:             ${{ secrets.STATS_KEY }}
      OPS_ALERT_EMAILS:      ${{ secrets.OPS_ALERT_EMAILS }}
      OPS_ALERT_WHATSAPP:    ${{ secrets.OPS_ALERT_WHATSAPP }}
      SMTP_HOST:             ${{ secrets.SMTP_HOST }}
      SMTP_PORT:             ${{ secrets.SMTP_PORT }}
      SMTP_USER:             ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD:         ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM:             ${{ secrets.SMTP_FROM }}
      TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_FROM:  ${{ secrets.TWILIO_WHATSAPP_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install --quiet awsebcli awscli twilio

      # 1) The version that is live RIGHT NOW is our PRE-DEPLOY rollback target.
      #    Captured BEFORE we deploy so that, if the new version turns out bad,
      #    we can redeploy exactly what was known-good moments ago.
      - name: Record last-good (pre-deploy) version
        id: lastgood
        run: |
          LG=$(python -c "from ops import mechanic; print(mechanic.current_version() or '')")
          echo "Current live (pre-deploy, last-good) version: $LG"
          echo "label=$LG" >> "$GITHUB_OUTPUT"

      # 2) Deploy the new version.
      - name: Deploy
        run: eb deploy "$OPS_EB_ENV"

      # 3) Wait for the environment to go Green (up to ~10 min).
      - name: Wait for Green
        id: green
        continue-on-error: true
        run: |
          for i in $(seq 1 40); do
            H=$(aws elasticbeanstalk describe-environments --environment-names "$OPS_EB_ENV" \
                  --region "$AWS_REGION" --query 'Environments[0].Health' --output text)
            echo "attempt $i: health=$H"
            [ "$H" = "Green" ] && exit 0
            sleep 15
          done
          echo "environment did not reach Green"; exit 1

      # 4) Smoke test the live site like a real customer.
      - name: Smoke test (robot customer)
        id: smoke
        continue-on-error: true
        working-directory: ops/robot_customer
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test

      # 5a) SUCCESS path -> record the passing run + alert.
      - name: Report success
        if: steps.green.outcome == 'success' && steps.smoke.outcome == 'success'
        run: |
          python -m ops.history record-run \
            --status pass \
            --detail "Guarded deploy: new version went Green and passed the smoke test."
          python -c "from ops import alerts; import os; alerts.send_alert('Deploy OK', 'New version deployed and smoke test passed on the live site.', 'info')"

      # 5b) FAILURE path -> automatic rollback to the PRE-DEPLOY last-good + alert.
      #     This rollback is SAFE (a known-good label captured moments ago), so it
      #     proceeds regardless of OPS_ROLLBACK_ARMED — but it still records the
      #     failing run + the rollback in history and alerts.
      - name: Roll back on failure
        if: steps.green.outcome != 'success' || steps.smoke.outcome != 'success'
        run: |
          LG="${{ steps.lastgood.outputs.label }}"
          echo "Deploy unhealthy — rolling back to pre-deploy version: $LG"
          # Record the failing guarded-deploy run either way.
          python -m ops.history record-run \
            --status fail \
            --detail "Guarded deploy: env never went Green or smoke test failed; rolling back."
          if [ -z "$LG" ] || [ "$LG" = "None" ]; then
            python -c "from ops import alerts; alerts.send_alert('Deploy FAILED — manual rollback needed', 'Smoke/health failed but no last-good version label was captured. Roll back manually in the EB console.', 'critical')"
            exit 1
          fi
          # Capture the (bad) version we are rolling back FROM, for the history record.
          BAD=$(python -c "from ops import mechanic; print(mechanic.current_version() or '')")
          python -m ops.mechanic rollback --last-good "$LG"
          # mechanic.rollback already alerts; also record the rollback in history.
          python -m ops.history record-rollback \
            --from "$BAD" \
            --to "$LG" \
            --reason "Post-deploy guard: new version failed health/smoke — reverted to pre-deploy version."
          # Fail the job so it shows red.
          exit 1
