name: CI

# Tests run on every push (any branch) and every PR, so both teammates get the
# same feedback. Production deploy is NOT automatic — it only runs when a human
# manually triggers this workflow ("Run workflow" in the Actions tab), and even
# then only if the tests pass. That's the deliberate "check it, then ship it" gate.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python tests (engine + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Elastic Beanstalk platform
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite (incl. engine regression guard)
        # NOTE: do not set STATS_KEY / RAZORPAY_WEBHOOK_SECRET / DB_PATH here.
        # tests/conftest.py sets the exact values the tests expect (via setdefault);
        # overriding them from the workflow makes the admin-auth tests fail.
        run: pytest -q

  e2e:
    name: Playwright E2E (mobile + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install app dependencies (source list, not the aarch64 wheelhouse)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.build.txt

      - name: Start the app (SQLite + demo mode)
        env:
          DEMO_MODE: "1"
          DB_PATH: /tmp/e2e.db
        run: |
          nohup uvicorn api:app --host 127.0.0.1 --port 8000 > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/shaadi >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/shaadi >/dev/null || { echo "app failed to boot"; cat /tmp/app.log; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + browser
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          CI: "1"
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload Playwright report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Production deploy — the ENFORCEMENT step.
  #   * needs: [test, e2e]  -> cannot run unless BOTH test suites pass (red = no deploy)
  #   * workflow_dispatch only -> deploy happens ONLY when a human clicks "Run workflow"
  #     (Actions tab), never automatically on push. That's the human "ship it" gate.
  #   * ref must be aws-mysql -> you can only dispatch a prod deploy from the prod branch.
  #   * environment: production -> if you later move to GitHub Pro/Team, add "Required
  #     reviewers" here for a second per-deploy approval; harmless until then.
  # Requires repo secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  deploy:
    name: Deploy to production (manual, only if tests pass)
    needs: [test, e2e]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/aws-mysql'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # eb deploy archives the git tree

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EB CLI
        run: pip install --upgrade pip awsebcli

      - name: Deploy to Elastic Beanstalk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
        run: eb deploy AxtroShastraProd
