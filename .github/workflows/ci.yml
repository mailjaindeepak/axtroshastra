name: CI

# Tests run on every push and PR. Production deploy only runs when a human
# manually triggers "Run workflow" from the Actions tab on the aws-mysql branch,
# AND both test suites pass. The deploy step includes a post-deploy smoke test
# and auto-rollback — the old ops-deploy-guard.yml merged in.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python tests (engine + API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite (incl. engine regression guard)
        timeout-minutes: 20
        run: pytest -q

  e2e:
    name: Playwright E2E (mobile + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install app dependencies (source list, not the aarch64 wheelhouse)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.build.txt

      - name: Start the app (SQLite + demo mode)
        env:
          DEMO_MODE: "1"
          DB_PATH: /tmp/e2e.db
        run: |
          nohup uvicorn api:app --host 127.0.0.1 --port 8000 > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/shaadi >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/shaadi >/dev/null || { echo "app failed to boot"; cat /tmp/app.log; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cache the downloaded Chromium so repeat runs skip the download entirely.
      # Keyed on the lockfile, so a Playwright version bump busts the cache.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # NOTE: deliberately NO --with-deps. It shells out to apt-get, which stalls
      # for ~55 min on unreachable Ubuntu mirrors (azure.archive.ubuntu.com "Ign:").
      # The ubuntu-latest runner image already ships Chromium's system libraries.
      - name: Install Playwright + browser
        timeout-minutes: 18
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install chromium

      - name: Run E2E tests
        timeout-minutes: 28
        working-directory: tests/e2e
        env:
          CI: "1"
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload Playwright report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Guarded production deploy — the ONE button.
  #
  #   pytest (459) ──┐
  #                  ├── all green ──► deploy ──► wait Green ──► smoke test
  #   E2E (21) ─────┘                                               │
  #                                                        pass ◄───┤───► fail
  #                                                         │              │
  #                                                     record OK    rollback + alert
  #
  #   * needs: [test, e2e]  -> blocked unless BOTH suites pass
  #   * workflow_dispatch + aws-mysql only -> human "ship it" gate
  #   * environment: production -> add Required Reviewers on Pro/Team
  #   * concurrency: eb-deploy -> never two deploys at once
  #   * Rollback is ALWAYS armed (pre-deploy version captured 5 min ago)
  #
  # Replaces the old standalone ops-deploy-guard.yml.
  deploy:
    name: Guarded deploy (manual, tests must pass)
    needs: [test, e2e]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/aws-mysql'
    runs-on: ubuntu-latest
    # eb deploy (~10m) + wait-for-Green (capped at 10m) + smoke test (~12m),
    # with headroom. Never let a wedged deploy sit for GitHub's 6h default.
    timeout-minutes: 75
    environment: production
    concurrency:
      group: eb-deploy
      cancel-in-progress: false
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # AWS
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ap-south-1
      AWS_REGION:            ${{ secrets.AWS_REGION }}
      OPS_EB_ENV:            ${{ secrets.OPS_EB_ENV }}
      # Alerting + smoke test
      OPS_TARGET_URL:        ${{ secrets.OPS_TARGET_URL }}
      STATS_KEY:             ${{ secrets.STATS_KEY }}
      OPS_ALERT_EMAILS:      ${{ secrets.OPS_ALERT_EMAILS }}
      OPS_ALERT_WHATSAPP:    ${{ secrets.OPS_ALERT_WHATSAPP }}
      SMTP_HOST:             ${{ secrets.SMTP_HOST }}
      SMTP_PORT:             ${{ secrets.SMTP_PORT }}
      SMTP_USER:             ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD:         ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM:             ${{ secrets.SMTP_FROM }}
      TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_FROM:  ${{ secrets.TWILIO_WHATSAPP_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: pip install --quiet awsebcli awscli twilio

      # ---- STAGE 1: Snapshot + Deploy ----

      - name: Record last-good (pre-deploy) version
        id: lastgood
        run: |
          LG=$(python -c "import logging; logging.basicConfig(level=logging.DEBUG); from ops import mechanic; print(mechanic.current_version() or '')")
          echo "Current live (rollback target): $LG"
          if [ -z "$LG" ] || [ "$LG" = "None" ]; then
            echo "::error::Cannot capture current EB version — refusing to deploy without a rollback target."
            echo "Check that OPS_EB_ENV and AWS credentials are set correctly in repo secrets."
            exit 1
          fi
          echo "label=$LG" >> "$GITHUB_OUTPUT"

      - name: Deploy to Elastic Beanstalk
        run: |
          LABEL="v$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)"
          BODY="$(git log -1 --pretty=%b | head -1 | xargs)"
          SUBJECT="$(git log -1 --pretty=%s)"
          MSG="${BODY:-$SUBJECT}"
          echo "Deploying as version: $LABEL — $MSG"
          eb deploy "${OPS_EB_ENV:-AxtroShastraProd}" --label "$LABEL" --message "$MSG"

      # ---- STAGE 2: Verify ----

      - name: Wait for Green (up to 10 min)
        id: green
        continue-on-error: true
        run: |
          REGION="${AWS_REGION:-ap-south-1}"
          ENV="${OPS_EB_ENV:-AxtroShastraProd}"
          for i in $(seq 1 40); do
            H=$(aws elasticbeanstalk describe-environments \
                  --environment-names "$ENV" --region "$REGION" \
                  --query 'Environments[0].Health' --output text)
            echo "attempt $i: health=$H"
            [ "$H" = "Green" ] && exit 0
            sleep 15
          done
          echo "environment did not reach Green"; exit 1

      - name: Cache Playwright browsers (smoke test)
        if: steps.green.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ops/robot_customer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # No --with-deps: see the note in the e2e job. apt-get is the stall.
      - name: Smoke test (robot customer on live site)
        id: smoke
        if: steps.green.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        working-directory: ops/robot_customer
        run: |
          npm install
          npx playwright install chromium
          npx playwright test

      # ---- STAGE 3a: SUCCESS ----

      - name: Report success
        if: steps.green.outcome == 'success' && steps.smoke.outcome == 'success'
        run: |
          python -m ops.history record-run \
            --status pass \
            --detail "CI deploy: tests passed, deployed, Green + smoke test passed." \
            --run-url "$RUN_URL"
          curl -sf -X POST \
            "${OPS_TARGET_URL}/api/admin/ops_event?key=${STATS_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"deploy\",\"status\":\"pass\",\"detail\":\"CI deploy succeeded — tests green, env Green, smoke test passed.\",\"run_url\":\"${RUN_URL}\",\"severity\":\"info\"}" \
            || echo "dashboard record failed (non-fatal)"
          python -c "from ops import alerts; alerts.send_alert('Deploy OK', 'Tests passed, new version deployed, smoke test passed on the live site.', 'info')"

      # ---- STAGE 3b: FAILURE -> rollback ----

      - name: Roll back on failure
        if: always() && steps.lastgood.outcome == 'success' && (steps.green.outcome != 'success' || steps.smoke.outcome != 'success')
        run: |
          LG="${{ steps.lastgood.outputs.label }}"
          echo "Deploy unhealthy — rolling back to: $LG"

          python -m ops.history record-run \
            --status fail \
            --detail "CI deploy: env not Green or smoke test failed; rolling back." \
            --run-url "$RUN_URL"

          curl -sf -X POST \
            "${OPS_TARGET_URL}/api/admin/ops_event?key=${STATS_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"deploy\",\"status\":\"fail\",\"detail\":\"CI deploy FAILED — env not Green or smoke test failed.\",\"run_url\":\"${RUN_URL}\",\"severity\":\"critical\"}" \
            || echo "dashboard record failed (non-fatal)"

          if [ -z "$LG" ] || [ "$LG" = "None" ]; then
            python -c "from ops import alerts; alerts.send_alert('Deploy FAILED — manual rollback needed', 'Smoke/health failed but no last-good version was captured. Roll back manually in the EB console.', 'critical')"
            exit 1
          fi

          BAD=$(python -c "from ops import mechanic; print(mechanic.current_version() or '')")

          if [ "$BAD" = "$LG" ]; then
            echo "Deploy command failed before changing the version — live site unchanged."
            python -c "from ops import alerts; alerts.send_alert('CI Deploy command FAILED', 'The eb deploy command itself failed. No new version was deployed — live site is unchanged. Check the Actions log: ${{ env.RUN_URL }}', 'critical')"
            exit 1
          fi

          python -m ops.mechanic rollback --last-good "$LG"

          python -m ops.history record-rollback \
            --from "$BAD" \
            --to "$LG" \
            --reason "CI deploy guard: new version failed health/smoke — reverted."

          curl -sf -X POST \
            "${OPS_TARGET_URL}/api/admin/ops_event?key=${STATS_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"rollback\",\"status\":\"triggered\",\"detail\":\"CI deploy guard rollback: ${BAD} -> ${LG}\",\"run_url\":\"${RUN_URL}\",\"from_ver\":\"${BAD}\",\"to_ver\":\"${LG}\",\"severity\":\"critical\"}" \
            || echo "dashboard record failed (non-fatal)"

          exit 1
