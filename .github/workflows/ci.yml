name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite (incl. engine regression guard)
        env:
          DEMO_MODE: "1"
          DB_PATH: /tmp/ci_reports.db
          RAZORPAY_WEBHOOK_SECRET: ci-secret
          STATS_KEY: ci-stats-key
        run: pytest -q
